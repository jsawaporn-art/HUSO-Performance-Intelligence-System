<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <!-- Background: Pristine clean white matching uploaded official logo -->
  <rect width="360" height="360" fill="#ffffff"/>
  
  <g id="huso-letters">
    <!-- H (Official HUSO Orange #F26522) -->
    <path d="M 52 72 L 52 168 M 52 120 L 98 120 M 98 72 L 98 168" 
          stroke="#F26522" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- U (Official HUSO Orange #F26522) -->
    <path d="M 125 72 L 125 145 C 125 160 135 168 148 168 C 161 168 171 160 171 145 L 171 72" 
          stroke="#F26522" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- S (Dark Charcoal #231F20) -->
    <path d="M 233 92 C 230 78 217 72 201 72 C 183 72 173 83 173 98 C 173 114 185 122 203 128 C 223 134 235 142 235 156 C 235 170 221 180 201 180 C 182 180 171 170 167 156" 
          stroke="#231F20" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- O (Dark Charcoal #231F20 ring with central Orange #F26522 core) -->
    <circle cx="282" cy="126" r="41" stroke="#231F20" stroke-width="22" fill="none"/>
    <circle cx="282" cy="126" r="21" fill="#F26522"/>
  </g>

  <!-- Subtitle Text: Faculty of Humanities and Social Sciences -->
  <text x="41" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#231F20" letter-spacing="-0.3">Faculty of Humanities</text>
  <text x="41" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#231F20" letter-spacing="-0.3">and Social Sciences</text>
</svg>
